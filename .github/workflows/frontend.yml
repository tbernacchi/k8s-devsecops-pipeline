name: Frontend Secure Pipeline

on:
  workflow_dispatch:
    inputs:
      run_only_stage:
        description: "Run only stage N (1-11). Empty = full pipeline."
        required: false
        default: ""
  push:
    paths:
      - "devsecops/apps/frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/reusable-app-pipeline.yml"
  pull_request:
    paths:
      - "devsecops/apps/frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/reusable-app-pipeline.yml"

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write
  attestations: write

jobs:
  frontend:
    uses: ./.github/workflows/reusable-app-pipeline.yml
    with:
      app_name: frontend
      app_path: devsecops/apps/frontend
      dockerfile_path: devsecops/apps/frontend/Dockerfile
      codeql_language: python
      dependency_file: devsecops/apps/frontend/src/frontend/requirements.txt
      deploy_name: frontend
      container_name: frontend
      route_prefix: /frontend
      deploy_dev: false
      deploy_staging: false
      run_only_stage: ${{ inputs.run_only_stage }}
    secrets: inherit # pragma: allowlist secret
