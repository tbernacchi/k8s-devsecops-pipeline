name: Reusable Secure App Pipeline

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_path:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      codeql_language:
        required: true
        type: string
      dependency_file:
        required: true
        type: string
      deploy_name:
        required: true
        type: string
      container_name:
        required: true
        type: string
      route_prefix:
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: "app"
      deploy_dev:
        required: false
        type: boolean
        default: false
      deploy_staging:
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      SNYK_TOKEN:
        required: false
      DEV_KUBECONFIG_B64:
        required: false
      STAGING_KUBECONFIG_B64:
        required: false
      PROD_KUBECONFIG_B64:
        required: false
      STAGING_BASE_URL:
        required: false
      PROD_BASE_URL:
        required: false
      SLACK_WEBHOOK_K8S_SEC_SECRETS:
        required: false
      SLACK_WEBHOOK_K8S_SEC_SAST:
        required: false
      SLACK_WEBHOOK_K8S_SEC_CVE:
        required: false
      SLACK_WEBHOOK_K8S_CI_FAILURES:
        required: false
      SLACK_WEBHOOK_K8S_BUILD_CI_FAILURES:
        required: false

jobs:
  # ──────────────────────────────────────────────
  # Stage 1 – Secret Detection
  # ──────────────────────────────────────────────
  stage1_secret_detection:
    name: "Stage 1 - Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan \
            --exclude-files 'README\.md' \
            --exclude-files '.*README\.md' \
            --exclude-files '.*\.example$' \
            > .secrets.baseline
          python3 -c "import json,sys; r=json.load(open('.secrets.baseline')).get('results',{}); [print('SECRET FOUND:',f,s['type']) for f,ss in r.items() for s in ss]; sys.exit(bool(r))"
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog
        run: |
          printf '.*README.*\n.*\.example$\n' > /tmp/th-exclude.txt
          docker run --rm \
            -v "$PWD:/pwd" \
            -v "/tmp/th-exclude.txt:/th-exclude.txt" \
            trufflesecurity/trufflehog:latest filesystem /pwd \
            --only-verified --fail --no-update \
            --exclude-paths=/th-exclude.txt
      - name: "Slack | k8s-sec-secrets"
        if: failure() && secrets.SLACK_WEBHOOK_K8S_SEC_SECRETS != ''
        run: |
          curl -sSf -X POST "${{ secrets.SLACK_WEBHOOK_K8S_SEC_SECRETS }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: *SECRET DETECTED* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`\ndetect-secrets / Gitleaks / TruffleHog found a verified secret. Rotate credentials immediately.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"

  # ──────────────────────────────────────────────
  # Stage 2 – Unit Tests + Code Quality
  # ──────────────────────────────────────────────
  stage2_unit_tests_quality:
    name: "Stage 2 - Unit Tests and Code Quality"
    needs: stage1_secret_detection
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: inputs.codeql_language == 'go'
        with:
          go-version-file: ${{ inputs.app_path }}/go.mod
          cache: true
          cache-dependency-path: ${{ inputs.app_path }}/go.sum
      - name: Unit tests (Go)
        if: inputs.codeql_language == 'go'
        working-directory: ${{ inputs.app_path }}
        run: |
          if git ls-files . | grep -Eq '_test\.go$'; then
            go test ./... -v -coverprofile=coverage.out -covermode=atomic
          else
            echo "No Go unit tests found. Skipping."
          fi
      - uses: actions/setup-python@v5
        if: inputs.codeql_language == 'python'
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: ${{ inputs.dependency_file }}
      - name: Unit tests (Python)
        if: inputs.codeql_language == 'python'
        run: |
          if [ -f "${{ inputs.dependency_file }}" ]; then
            pip install -r "${{ inputs.dependency_file }}"
          fi
          pip install pytest pytest-cov
          if git ls-files "${{ inputs.app_path }}" | grep -Eq '(^|/)(test_.*\.py|.*_test\.py)$'; then
            pytest -q "${{ inputs.app_path }}" \
              --cov="${{ inputs.app_path }}" \
              --cov-report=xml:coverage.xml
          else
            echo "No Python unit tests found. Skipping."
          fi
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ inputs.app_name }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.sources=${{ inputs.app_path }}
            -Dsonar.go.coverage.reportPaths=${{ inputs.app_path }}/coverage.out
            -Dsonar.python.coverage.reportPaths=coverage.xml
      - name: SonarQube Quality Gate
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: "300"
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      - name: SonarQube skipped
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: echo "Skipping SonarQube because SONAR_TOKEN/SONAR_HOST_URL are not configured."
      - name: "Slack | k8s-ci-failures"
        if: failure() && secrets.SLACK_WEBHOOK_K8S_CI_FAILURES != ''
        run: |
          curl -sSf -X POST "${{ secrets.SLACK_WEBHOOK_K8S_CI_FAILURES }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":x: *Unit Tests / Quality Gate failed* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"

  # ──────────────────────────────────────────────
  # Stage 3 – SAST  (parallel with 4 and 5)
  # ──────────────────────────────────────────────
  stage3_sast:
    name: "Stage 3 - SAST"
    needs: stage2_unit_tests_quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        run: |
          pip install semgrep --quiet
          semgrep scan --config=auto "${{ inputs.app_path }}" --sarif > semgrep.sarif
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.codeql_language }}
      - if: inputs.codeql_language == 'go'
        uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
      - name: "Slack | k8s-sec-sast"
        if: failure() && secrets.SLACK_WEBHOOK_K8S_SEC_SAST != ''
        run: |
          curl -sSf -X POST "${{ secrets.SLACK_WEBHOOK_K8S_SEC_SAST }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: *SAST finding* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`\nSemgrep or CodeQL detected a vulnerability in source code.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"

  # ──────────────────────────────────────────────
  # Stage 4 – SCA  (parallel with 3 and 5)
  # ──────────────────────────────────────────────
  stage4_sca:
    name: "Stage 4 - SCA"
    needs: stage2_unit_tests_quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy dependency scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:latest fs /repo/${{ inputs.app_path }} \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      - name: OWASP Dependency Check
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD/${{ inputs.app_path }}:/src" \
            -v "$PWD/reports:/report" \
            owasp/dependency-check:latest \
            --scan /src \
            --format HTML \
            --out /report \
            --project "${{ inputs.app_name }}" \
            --enableRetired \
            --failOnCVSS 7
      - name: Snyk (Go)
        if: inputs.codeql_language == 'go'
        continue-on-error: true
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=${{ inputs.dependency_file }}
      - name: Snyk (Python)
        if: inputs.codeql_language == 'python'
        continue-on-error: true
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=${{ inputs.dependency_file }}
      - name: Snyk skipped
        if: inputs.codeql_language != 'go' && inputs.codeql_language != 'python'
        run: echo "Skipping Snyk because no mapped action exists for language '${{ inputs.codeql_language }}'."
      - name: "Slack | k8s-sec-cve"
        if: failure() && secrets.SLACK_WEBHOOK_K8S_SEC_CVE != ''
        run: |
          curl -sSf -X POST "${{ secrets.SLACK_WEBHOOK_K8S_SEC_CVE }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":biohazard_sign: *CVE HIGH/CRITICAL found* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`\nTrivy / OWASP DC / Snyk detected a vulnerable dependency.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"

  # ──────────────────────────────────────────────
  # Stage 5 – Build + Sign + Attest
  # ──────────────────────────────────────────────
  stage6_build_sign_attest:
    name: "Stage 5 - Build and Artifact Signing"
    needs: [stage3_sast, stage4_sca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image_ref=ghcr.io/${{ github.repository }}-${{ inputs.app_name }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.app_path }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Cosign sign
        run: |
          cosign sign --yes "${{ steps.meta.outputs.image_ref }}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.meta.outputs.image_ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: "Slack | k8s-build-ci-failures"
        if: failure() && secrets.SLACK_WEBHOOK_K8S_BUILD_CI_FAILURES != ''
        run: |
          curl -sSf -X POST "${{ secrets.SLACK_WEBHOOK_K8S_BUILD_CI_FAILURES }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\":x: *Build / Sign / Attest failed* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}"

  # ──────────────────────────────────────────────
  # Stage 6 – Deploy Dev
  # ──────────────────────────────────────────────
  deploy_dev:
    name: "Stage 6 - Dev Auto Deploy"
    needs: stage6_build_sign_attest
    if: github.ref == 'refs/heads/main' && inputs.deploy_dev
    runs-on: k8s-system-design
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Deploy same signed artifact to dev
        env:
          KCFG: ${{ secrets.DEV_KUBECONFIG_B64 }}
          IMAGE: ${{ needs.stage6_build_sign_attest.outputs.image_ref }}@${{ needs.stage6_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          kube_config=$(mktemp)
          trap "rm -f '$kube_config'" EXIT
          echo "$KCFG" | base64 -d > "$kube_config"
          chmod 600 "$kube_config"
          export KUBECONFIG="$kube_config"
          kubectl get namespace ${{ inputs.namespace }} 2>/dev/null || kubectl create namespace ${{ inputs.namespace }}
          if kubectl get deployment ${{ inputs.deploy_name }} -n ${{ inputs.namespace }} 2>/dev/null; then
            kubectl -n ${{ inputs.namespace }} set image deployment/${{ inputs.deploy_name }} ${{ inputs.container_name }}="$IMAGE"
          else
            kubectl create deployment ${{ inputs.deploy_name }} --image="$IMAGE" -n ${{ inputs.namespace }}
          fi
          kubectl -n ${{ inputs.namespace }} rollout status deployment/${{ inputs.deploy_name }} --timeout=180s

  # ──────────────────────────────────────────────
  # Stage 7 – Deploy Staging
  # ──────────────────────────────────────────────
  deploy_staging:
    name: "Stage 7 - Staging Auto Deploy"
    needs: [deploy_dev, stage6_build_sign_attest]
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Deploy same signed artifact to staging
        env:
          KCFG: ${{ secrets.STAGING_KUBECONFIG_B64 }}
          IMAGE: ${{ needs.stage6_build_sign_attest.outputs.image_ref }}@${{ needs.stage6_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          kube_config=$(mktemp)
          trap "rm -f '$kube_config'" EXIT
          echo "$KCFG" | base64 -d > "$kube_config"
          chmod 600 "$kube_config"
          export KUBECONFIG="$kube_config"
          kubectl get namespace ${{ inputs.namespace }} 2>/dev/null || kubectl create namespace ${{ inputs.namespace }}
          if kubectl get deployment ${{ inputs.deploy_name }} -n ${{ inputs.namespace }} 2>/dev/null; then
            kubectl -n ${{ inputs.namespace }} set image deployment/${{ inputs.deploy_name }} ${{ inputs.container_name }}="$IMAGE"
          else
            kubectl create deployment ${{ inputs.deploy_name }} --image="$IMAGE" -n ${{ inputs.namespace }}
          fi
          kubectl -n ${{ inputs.namespace }} rollout status deployment/${{ inputs.deploy_name }} --timeout=180s

  # ──────────────────────────────────────────────
  # Stage 8 – Smoke Tests
  # ──────────────────────────────────────────────
  stage7_integration_e2e:
    name: "Stage 8 - Smoke Tests"
    needs: deploy_staging
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    steps:
      - name: Smoke tests on staging
        run: |
          test -n "${{ secrets.STAGING_BASE_URL }}"
          curl -fsS "${{ secrets.STAGING_BASE_URL }}${{ inputs.route_prefix }}/healthz"

  # ──────────────────────────────────────────────
  # Stage 9 – DAST
  # ──────────────────────────────────────────────
  stage8_dast:
    name: "Stage 9 - DAST"
    needs: stage7_integration_e2e
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    steps:
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_BASE_URL }}${{ inputs.route_prefix }}
          fail_action: true

  # ──────────────────────────────────────────────
  # Stage 10 – Policy Gate (verifica assinatura real)
  # ──────────────────────────────────────────────
  policy_gate:
    name: "Stage 10 - Policy Gate"
    needs: [stage8_dast, stage6_build_sign_attest]
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Verify cosign signature
        env:
          IMAGE: ${{ needs.stage6_build_sign_attest.outputs.image_ref }}@${{ needs.stage6_build_sign_attest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE"

  # ──────────────────────────────────────────────
  # Stage 11 – Prod Deploy (manual approval required)
  # ──────────────────────────────────────────────
  deploy_prod:
    name: "Stage 11 - Prod Approval and Progressive Deploy"
    needs: [policy_gate, stage6_build_sign_attest]
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    environment: production
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Progressive rollout with auto rollback
        env:
          KCFG: ${{ secrets.PROD_KUBECONFIG_B64 }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          IMAGE: ${{ needs.stage6_build_sign_attest.outputs.image_ref }}@${{ needs.stage6_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          kube_config=$(mktemp)
          trap "rm -f '$kube_config'" EXIT
          echo "$KCFG" | base64 -d > "$kube_config"
          chmod 600 "$kube_config"
          export KUBECONFIG="$kube_config"
          kubectl get namespace ${{ inputs.namespace }} 2>/dev/null || kubectl create namespace ${{ inputs.namespace }}
          if kubectl get deployment ${{ inputs.deploy_name }} -n ${{ inputs.namespace }} 2>/dev/null; then
            kubectl -n ${{ inputs.namespace }} set image deployment/${{ inputs.deploy_name }} ${{ inputs.container_name }}="$IMAGE"
          else
            kubectl create deployment ${{ inputs.deploy_name }} --image="$IMAGE" -n ${{ inputs.namespace }}
          fi
          if ! kubectl -n ${{ inputs.namespace }} rollout status deployment/${{ inputs.deploy_name }} --timeout=240s; then
            kubectl -n ${{ inputs.namespace }} rollout undo deployment/${{ inputs.deploy_name }}
            exit 1
          fi
          if [ -n "$PROD_BASE_URL" ]; then
            if ! curl -fsS "${PROD_BASE_URL}${{ inputs.route_prefix }}/healthz"; then
              kubectl -n ${{ inputs.namespace }} rollout undo deployment/${{ inputs.deploy_name }}
              exit 1
            fi
          fi

