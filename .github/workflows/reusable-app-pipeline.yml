name: Reusable Secure App Pipeline

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_path:
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      codeql_language:
        required: true
        type: string
      dependency_file:
        required: true
        type: string
      deploy_name:
        required: true
        type: string
      container_name:
        required: true
        type: string
      route_prefix:
        required: true
        type: string
      namespace:
        required: false
        type: string
        default: "app"
      deploy_dev:
        required: false
        type: boolean
        default: false
      deploy_staging:
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      SNYK_TOKEN:
        required: false
      DEV_KUBECONFIG_B64:
        required: false
      STAGING_KUBECONFIG_B64:
        required: false
      PROD_KUBECONFIG_B64:
        required: false
      STAGING_BASE_URL:
        required: false
      PROD_BASE_URL:
        required: false
      SLACK_WEBHOOK_K8S_DEVSECOPS:
        required: false
      NVD_API_KEY:
        required: false

jobs:
  # ──────────────────────────────────────────────
  # Stage 1 – Secret Detection
  # ──────────────────────────────────────────────
  stage1_secret_detection:
    name: "Stage 1 - Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: detect-secrets
        id: detect_secrets
        continue-on-error: true
        run: |
          pip install detect-secrets
          detect-secrets scan \
            --exclude-files 'README\.md' \
            --exclude-files '.*README\.md' \
            --exclude-files '.*\.example$' \
            > .secrets.baseline
          python3 -c "import json,sys; r=json.load(open('.secrets.baseline')).get('results',{}); [print('SECRET FOUND:',f,s['type']) for f,ss in r.items() for s in ss]; sys.exit(bool(r))" \
            2>&1 | tee /tmp/detect-secrets.log
      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog
        id: trufflehog
        continue-on-error: true
        run: |
          printf '.*README.*\n.*\.example$\n' > /tmp/th-exclude.txt
          docker run --rm \
            -v "$PWD:/pwd" \
            -v "/tmp/th-exclude.txt:/th-exclude.txt" \
            trufflesecurity/trufflehog:latest filesystem /pwd \
            --only-verified --fail --no-update \
            --exclude-paths=/th-exclude.txt \
            2>&1 | tee /tmp/trufflehog.log
      - name: "Slack | k8s-devsecops-pipe"
        if: steps.detect_secrets.outcome == 'failure' || steps.gitleaks.outcome == 'failure' || steps.trufflehog.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_K8S_DEVSECOPS }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          FAILED=""
          LOG=""
          [ "${{ steps.detect_secrets.outcome }}" = "failure" ] && FAILED="detect-secrets" \
            && LOG=$(tail -25 /tmp/detect-secrets.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g')
          [ "${{ steps.gitleaks.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }Gitleaks"
          [ "${{ steps.trufflehog.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }TruffleHog" \
            && { [ -z "$LOG" ] && LOG=$(tail -25 /tmp/trufflehog.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g'); }
          jq -n \
            --arg header ":rotating_light: *[Stage 1 - Secret Detection] ${FAILED} failed* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`" \
            --arg log "${LOG:-see run logs}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"blocks":[
              {"type":"section","text":{"type":"mrkdwn","text":$header}},
              {"type":"section","text":{"type":"mrkdwn","text":("```" + $log + "```")}},
              {"type":"section","text":{"type":"mrkdwn","text":("<" + $url + "|View full run>")}}
            ]}' | \
          curl -sSf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @-
      - name: Fail if secret detected
        if: steps.detect_secrets.outcome == 'failure' || steps.gitleaks.outcome == 'failure' || steps.trufflehog.outcome == 'failure'
        run: exit 1

  # ──────────────────────────────────────────────
  # Stage 2 – Unit Tests + Code Quality
  # ──────────────────────────────────────────────
  stage2_unit_tests_quality:
    name: "Stage 2 - Unit Tests and Code Quality"
    needs: stage1_secret_detection
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: inputs.codeql_language == 'go'
        with:
          go-version-file: ${{ inputs.app_path }}/go.mod
          cache: true
          cache-dependency-path: ${{ inputs.app_path }}/go.sum
      - name: Unit tests (Go)
        id: go_tests
        if: inputs.codeql_language == 'go'
        continue-on-error: true
        working-directory: ${{ inputs.app_path }}
        run: |
          if git ls-files . | grep -Eq '_test\.go$'; then
            go test ./... -v -coverprofile=coverage.out -covermode=atomic 2>&1 | tee /tmp/go-tests.log
          else
            echo "No Go unit tests found. Skipping."
          fi
      - uses: actions/setup-python@v5
        if: inputs.codeql_language == 'python'
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: ${{ inputs.dependency_file }}
      - name: Unit tests (Python)
        id: python_tests
        if: inputs.codeql_language == 'python'
        continue-on-error: true
        run: |
          if [ -f "${{ inputs.dependency_file }}" ]; then
            pip install -r "${{ inputs.dependency_file }}"
          fi
          pip install pytest pytest-cov
          if git ls-files "${{ inputs.app_path }}" | grep -Eq '(^|/)(test_.*\.py|.*_test\.py)$'; then
            pytest -q "${{ inputs.app_path }}" \
              --cov="${{ inputs.app_path }}" \
              --cov-report=xml:coverage.xml \
              2>&1 | tee /tmp/pytest.log
          else
            echo "No Python unit tests found. Skipping."
          fi
      - name: SonarQube Scan
        id: sonar_scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ inputs.app_name }}
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.sources=${{ inputs.app_path }}
            -Dsonar.go.coverage.reportPaths=${{ inputs.app_path }}/coverage.out
            -Dsonar.python.coverage.reportPaths=coverage.xml
      - name: SonarQube Quality Gate
        id: sonar_qg
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: "300"
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
      - name: SonarQube skipped
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: echo "Skipping SonarQube because SONAR_TOKEN/SONAR_HOST_URL are not configured."
      - name: "Slack | k8s-devsecops-pipe"
        if: steps.go_tests.outcome == 'failure' || steps.python_tests.outcome == 'failure' || steps.sonar_scan.outcome == 'failure' || steps.sonar_qg.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_K8S_DEVSECOPS }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          FAILED=""
          LOG=""
          [ "${{ steps.go_tests.outcome }}" = "failure" ] && FAILED="Go tests" \
            && LOG=$(tail -25 /tmp/go-tests.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g')
          [ "${{ steps.python_tests.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }Python tests" \
            && { [ -z "$LOG" ] && LOG=$(tail -25 /tmp/pytest.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g'); }
          [ "${{ steps.sonar_scan.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }SonarQube Scan"
          [ "${{ steps.sonar_qg.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }SonarQube Quality Gate"
          jq -n \
            --arg header ":x: *[Stage 2 - Unit Tests / Quality] ${FAILED} failed* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`" \
            --arg log "${LOG:-see run logs}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"blocks":[
              {"type":"section","text":{"type":"mrkdwn","text":$header}},
              {"type":"section","text":{"type":"mrkdwn","text":("```" + $log + "```")}},
              {"type":"section","text":{"type":"mrkdwn","text":("<" + $url + "|View full run>")}}
            ]}' | \
          curl -sSf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @-
      - name: Fail if tests or quality gate failed
        if: steps.go_tests.outcome == 'failure' || steps.python_tests.outcome == 'failure' || steps.sonar_scan.outcome == 'failure' || steps.sonar_qg.outcome == 'failure'
        run: exit 1

  # ──────────────────────────────────────────────
  # Stage 3 – SAST  (parallel with 4)
  # ──────────────────────────────────────────────
  stage3_sast:
    name: "Stage 3 - SAST"
    needs: stage2_unit_tests_quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        id: semgrep
        continue-on-error: true
        run: |
          pip install semgrep --quiet
          semgrep scan --config=auto "${{ inputs.app_path }}" --sarif > semgrep.sarif \
            2>/tmp/semgrep.log
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: CodeQL init
        id: codeql_init
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.codeql_language }}
      - name: CodeQL autobuild
        id: codeql_autobuild
        if: inputs.codeql_language == 'go'
        continue-on-error: true
        uses: github/codeql-action/autobuild@v4
      - name: CodeQL analyze
        id: codeql_analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
      - name: "Slack | k8s-devsecops-pipe"
        if: steps.semgrep.outcome == 'failure' || steps.codeql_analyze.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_K8S_DEVSECOPS }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          FAILED=""
          LOG=""
          [ "${{ steps.semgrep.outcome }}" = "failure" ] && FAILED="Semgrep" \
            && LOG=$(tail -25 /tmp/semgrep.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g')
          [ "${{ steps.codeql_analyze.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }CodeQL"
          jq -n \
            --arg header ":warning: *[Stage 3 - SAST] ${FAILED} failed* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`" \
            --arg log "${LOG:-see run logs}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"blocks":[
              {"type":"section","text":{"type":"mrkdwn","text":$header}},
              {"type":"section","text":{"type":"mrkdwn","text":("```" + $log + "```")}},
              {"type":"section","text":{"type":"mrkdwn","text":("<" + $url + "|View full run>")}}
            ]}' | \
          curl -sSf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @-
      - name: Fail if SAST check failed
        if: steps.semgrep.outcome == 'failure' || steps.codeql_analyze.outcome == 'failure'
        run: exit 1

  # ──────────────────────────────────────────────
  # Stage 4 – SCA  (parallel with 3)
  # ──────────────────────────────────────────────
  stage4_sca:
    name: "Stage 4 - SCA"
    needs: stage2_unit_tests_quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get date for cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache OWASP DC NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp-dc
          key: owasp-dc-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: owasp-dc-${{ runner.os }}-
      - name: Trivy dependency scan
        id: trivy
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:latest fs /repo/${{ inputs.app_path }} \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            2>&1 | tee /tmp/trivy.log
      - name: OWASP Dependency Check
        id: owasp
        continue-on-error: true
        run: |
          mkdir -p reports ~/.owasp-dc
          NVD_FLAG=""
          [ -n "${{ secrets.NVD_API_KEY }}" ] && NVD_FLAG="--nvdApiKey ${{ secrets.NVD_API_KEY }}"
          docker run --rm \
            -v "$PWD/${{ inputs.app_path }}:/src" \
            -v "$PWD/reports:/report" \
            -v "$HOME/.owasp-dc:/usr/share/dependency-check/data" \
            owasp/dependency-check:latest \
            --scan /src \
            --format JSON \
            --out /report \
            --project "${{ inputs.app_name }}" \
            --enableRetired \
            --failOnCVSS 7 \
            $NVD_FLAG \
            2>&1 | tee /tmp/owasp.log
      - name: Snyk (Go)
        id: snyk_go
        if: inputs.codeql_language == 'go'
        continue-on-error: true
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=${{ inputs.dependency_file }}
      - name: Snyk (Python)
        id: snyk_python
        if: inputs.codeql_language == 'python'
        continue-on-error: true
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=${{ inputs.dependency_file }}
      - name: Snyk skipped
        if: inputs.codeql_language != 'go' && inputs.codeql_language != 'python'
        run: echo "Skipping Snyk because no mapped action exists for language '${{ inputs.codeql_language }}'."
      - name: "Slack | k8s-devsecops-pipe"
        if: steps.trivy.outcome == 'failure' || steps.owasp.outcome == 'failure' || steps.snyk_go.outcome == 'failure' || steps.snyk_python.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_K8S_DEVSECOPS }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          FAILED=""
          LOG=""
          [ "${{ steps.trivy.outcome }}" = "failure" ] && FAILED="Trivy" \
            && LOG=$(tail -25 /tmp/trivy.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g')
          [ "${{ steps.owasp.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }OWASP DC" \
            && { [ -z "$LOG" ] && LOG=$(tail -25 /tmp/owasp.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g'); }
          [ "${{ steps.snyk_go.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }Snyk"
          [ "${{ steps.snyk_python.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }Snyk"
          jq -n \
            --arg header ":biohazard_sign: *[Stage 4 - SCA] ${FAILED} failed* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`" \
            --arg log "${LOG:-see run logs}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"blocks":[
              {"type":"section","text":{"type":"mrkdwn","text":$header}},
              {"type":"section","text":{"type":"mrkdwn","text":("```" + $log + "```")}},
              {"type":"section","text":{"type":"mrkdwn","text":("<" + $url + "|View full run>")}}
            ]}' | \
          curl -sSf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @-
      - name: Fail if SCA check failed
        if: steps.trivy.outcome == 'failure' || steps.owasp.outcome == 'failure' || steps.snyk_go.outcome == 'failure' || steps.snyk_python.outcome == 'failure'
        run: exit 1

  # ──────────────────────────────────────────────
  # Stage 5 – Build + Sign + Attest
  # ──────────────────────────────────────────────
  stage6_build_sign_attest:
    name: "Stage 5 - Build and Artifact Signing"
    needs: [stage3_sast, stage4_sca]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image_ref=ghcr.io/${{ github.repository }}-${{ inputs.app_name }}" >> "$GITHUB_OUTPUT"
      - id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.app_path }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Cosign sign
        id: cosign
        continue-on-error: true
        run: |
          cosign sign --yes "${{ steps.meta.outputs.image_ref }}@${{ steps.build.outputs.digest }}" \
            2>&1 | tee /tmp/cosign.log
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.meta.outputs.image_ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: "Slack | k8s-devsecops-pipe"
        if: steps.build.outcome == 'failure' || steps.cosign.outcome == 'failure' || steps.attest.outcome == 'failure'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_K8S_DEVSECOPS }}
        run: |
          [ -z "$SLACK_WEBHOOK" ] && exit 0
          FAILED=""
          LOG=""
          [ "${{ steps.build.outcome }}" = "failure" ] && FAILED="Docker build"
          [ "${{ steps.cosign.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }Cosign sign" \
            && { [ -z "$LOG" ] && LOG=$(tail -25 /tmp/cosign.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g'); }
          [ "${{ steps.attest.outcome }}" = "failure" ] \
            && FAILED="${FAILED:+$FAILED, }Attest"
          jq -n \
            --arg header ":x: *[Stage 5 - Build / Sign / Attest] ${FAILED} failed* — \`${{ inputs.app_name }}\` branch \`${{ github.ref_name }}\`" \
            --arg log "${LOG:-see run logs}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{"blocks":[
              {"type":"section","text":{"type":"mrkdwn","text":$header}},
              {"type":"section","text":{"type":"mrkdwn","text":("```" + $log + "```")}},
              {"type":"section","text":{"type":"mrkdwn","text":("<" + $url + "|View full run>")}}
            ]}' | \
          curl -sSf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @-
      - name: Fail if build or signing failed
        if: steps.build.outcome == 'failure' || steps.cosign.outcome == 'failure' || steps.attest.outcome == 'failure'
        run: exit 1

  # ──────────────────────────────────────────────
  # Stage 6 – Deploy Dev
  # ──────────────────────────────────────────────
  deploy_dev:
    name: "Stage 6 - Dev Auto Deploy"
    needs: stage6_build_sign_attest
    if: github.ref == 'refs/heads/main' && inputs.deploy_dev
    runs-on: k8s-system-design
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Deploy same signed artifact to dev
        env:
          KCFG: ${{ secrets.DEV_KUBECONFIG_B64 }}
          IMAGE: ${{ needs.stage6_build_sign_attest.outputs.image_ref }}@${{ needs.stage6_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          kube_config=$(mktemp)
          trap "rm -f '$kube_config'" EXIT
          echo "$KCFG" | base64 -d > "$kube_config"
          chmod 600 "$kube_config"
          export KUBECONFIG="$kube_config"
          kubectl get namespace ${{ inputs.namespace }} 2>/dev/null || kubectl create namespace ${{ inputs.namespace }}
          if kubectl get deployment ${{ inputs.deploy_name }} -n ${{ inputs.namespace }} 2>/dev/null; then
            kubectl -n ${{ inputs.namespace }} set image deployment/${{ inputs.deploy_name }} ${{ inputs.container_name }}="$IMAGE"
          else
            kubectl create deployment ${{ inputs.deploy_name }} --image="$IMAGE" -n ${{ inputs.namespace }}
          fi
          kubectl -n ${{ inputs.namespace }} rollout status deployment/${{ inputs.deploy_name }} --timeout=180s

  # ──────────────────────────────────────────────
  # Stage 7 – Deploy Staging
  # ──────────────────────────────────────────────
  deploy_staging:
    name: "Stage 7 - Staging Auto Deploy"
    needs: [deploy_dev, stage6_build_sign_attest]
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Deploy same signed artifact to staging
        env:
          KCFG: ${{ secrets.STAGING_KUBECONFIG_B64 }}
          IMAGE: ${{ needs.stage6_build_sign_attest.outputs.image_ref }}@${{ needs.stage6_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          kube_config=$(mktemp)
          trap "rm -f '$kube_config'" EXIT
          echo "$KCFG" | base64 -d > "$kube_config"
          chmod 600 "$kube_config"
          export KUBECONFIG="$kube_config"
          kubectl get namespace ${{ inputs.namespace }} 2>/dev/null || kubectl create namespace ${{ inputs.namespace }}
          if kubectl get deployment ${{ inputs.deploy_name }} -n ${{ inputs.namespace }} 2>/dev/null; then
            kubectl -n ${{ inputs.namespace }} set image deployment/${{ inputs.deploy_name }} ${{ inputs.container_name }}="$IMAGE"
          else
            kubectl create deployment ${{ inputs.deploy_name }} --image="$IMAGE" -n ${{ inputs.namespace }}
          fi
          kubectl -n ${{ inputs.namespace }} rollout status deployment/${{ inputs.deploy_name }} --timeout=180s

  # ──────────────────────────────────────────────
  # Stage 8 – Smoke Tests
  # ──────────────────────────────────────────────
  stage7_integration_e2e:
    name: "Stage 8 - Smoke Tests"
    needs: deploy_staging
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    steps:
      - name: Smoke tests on staging
        run: |
          test -n "${{ secrets.STAGING_BASE_URL }}"
          curl -fsS "${{ secrets.STAGING_BASE_URL }}${{ inputs.route_prefix }}/healthz"

  # ──────────────────────────────────────────────
  # Stage 9 – DAST
  # ──────────────────────────────────────────────
  stage8_dast:
    name: "Stage 9 - DAST"
    needs: stage7_integration_e2e
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    steps:
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_BASE_URL }}${{ inputs.route_prefix }}
          fail_action: true

  # ──────────────────────────────────────────────
  # Stage 10 – Policy Gate (verifica assinatura real)
  # ──────────────────────────────────────────────
  policy_gate:
    name: "Stage 10 - Policy Gate"
    needs: [stage8_dast, stage6_build_sign_attest]
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Verify cosign signature
        env:
          IMAGE: ${{ needs.stage6_build_sign_attest.outputs.image_ref }}@${{ needs.stage6_build_sign_attest.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE"

  # ──────────────────────────────────────────────
  # Stage 11 – Prod Deploy (manual approval required)
  # ──────────────────────────────────────────────
  deploy_prod:
    name: "Stage 11 - Prod Approval and Progressive Deploy"
    needs: [policy_gate, stage6_build_sign_attest]
    if: github.ref == 'refs/heads/main' && inputs.deploy_staging
    runs-on: k8s-system-design
    environment: production
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Progressive rollout with auto rollback
        env:
          KCFG: ${{ secrets.PROD_KUBECONFIG_B64 }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          IMAGE: ${{ needs.stage6_build_sign_attest.outputs.image_ref }}@${{ needs.stage6_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          kube_config=$(mktemp)
          trap "rm -f '$kube_config'" EXIT
          echo "$KCFG" | base64 -d > "$kube_config"
          chmod 600 "$kube_config"
          export KUBECONFIG="$kube_config"
          kubectl get namespace ${{ inputs.namespace }} 2>/dev/null || kubectl create namespace ${{ inputs.namespace }}
          if kubectl get deployment ${{ inputs.deploy_name }} -n ${{ inputs.namespace }} 2>/dev/null; then
            kubectl -n ${{ inputs.namespace }} set image deployment/${{ inputs.deploy_name }} ${{ inputs.container_name }}="$IMAGE"
          else
            kubectl create deployment ${{ inputs.deploy_name }} --image="$IMAGE" -n ${{ inputs.namespace }}
          fi
          if ! kubectl -n ${{ inputs.namespace }} rollout status deployment/${{ inputs.deploy_name }} --timeout=240s; then
            kubectl -n ${{ inputs.namespace }} rollout undo deployment/${{ inputs.deploy_name }}
            exit 1
          fi
          if [ -n "$PROD_BASE_URL" ]; then
            if ! curl -fsS "${PROD_BASE_URL}${{ inputs.route_prefix }}/healthz"; then
              kubectl -n ${{ inputs.namespace }} rollout undo deployment/${{ inputs.deploy_name }}
              exit 1
            fi
          fi
