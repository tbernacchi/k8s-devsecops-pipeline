name: Frontend Secure Pipeline

on:
  push:
    paths:
      - "devops-system-design-challenge/frontend/**"
      - "devops-system-design-challenge/frontend/.github/pipeline.yaml"
      - "infra/**"
  pull_request:
    paths:
      - "devops-system-design-challenge/frontend/**"
      - "devops-system-design-challenge/frontend/.github/pipeline.yaml"
      - "infra/**"

permissions:
  contents: read
  security-events: write

jobs:
  stage1_secret_detection:
    name: "Stage 1 - Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: detect-secrets as pre-commit hook
        run: |
          pip install pre-commit detect-secrets
          cat <<'EOF' > .pre-commit-ci.yaml
          repos:
            - repo: https://github.com/Yelp/detect-secrets
              rev: v1.5.0
              hooks:
                - id: detect-secrets
          EOF
          pre-commit run --config .pre-commit-ci.yaml --all-files
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog
        run: |
          docker run --rm -v "$PWD:/pwd" trufflesecurity/trufflehog:latest filesystem /pwd --fail --no-update

  stage2_sast:
    name: "Stage 2 - SAST"
    needs: stage1_secret_detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
      - name: SonarQube
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository }}-frontend
            -Dsonar.sources=devops-system-design-challenge/frontend

  stage3_sca:
    name: "Stage 3 - SCA"
    needs: stage2_sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: devops-system-design-challenge/frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: frontend
          path: devops-system-design-challenge/frontend
          format: HTML
          out: reports
          args: >
            --enableRetired
            --failOnCVSS 7
      - name: Snyk
        continue-on-error: true
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=devops-system-design-challenge/frontend/src/frontend/requirements.txt

  stage4_container_iac_scanning:
    name: "Stage 4 - Container and IaC Scanning"
    needs: stage3_sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: |
          docker build -f devops-system-design-challenge/frontend/Dockerfile -t local/frontend:${{ github.sha }} devops-system-design-challenge/frontend
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Grype image scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype local/frontend:${{ github.sha }} --fail-on high
      - name: Anchore image scan
        uses: anchore/scan-action@v6
        with:
          image: local/frontend:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
      - name: Checkov IaC scan
        if: hashFiles('infra/**') != ''
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
      - name: tfsec IaC scan
        if: hashFiles('infra/**/*.tf') != ''
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
      - name: Conftest IaC scan
        if: hashFiles('infra/**') != ''
        run: |
          wget -qO- https://github.com/open-policy-agent/conftest/releases/download/v0.54.0/conftest_0.54.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin
          cat <<'EOF' > /tmp/infra.rego
          package main
          deny[msg] {
            input.kind == "Deployment"
            not input.spec.template.spec.securityContext.runAsNonRoot
            msg := "runAsNonRoot must be true"
          }
          EOF
          conftest test infra -p /tmp

  stage5_build_sign_attest:
    name: "Stage 5 - Build and Artifact Signing"
    needs: stage4_container_iac_scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image_ref=ghcr.io/${{ github.repository_owner }}/system-design-2026-frontend" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: devops-system-design-challenge/frontend
          file: devops-system-design-challenge/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Cosign sign
        run: |
          cosign sign --yes "${{ steps.meta.outputs.image_ref }}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.meta.outputs.image_ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy_dev:
    name: "Stage 7 - Dev Auto Deploy"
    needs: stage5_build_sign_attest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Deploy same signed artifact to dev
        env:
          KCFG: ${{ secrets.DEV_KUBECONFIG_B64 }}
          IMAGE: ${{ needs.stage5_build_sign_attest.outputs.image_ref }}@${{ needs.stage5_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          echo "$KCFG" | base64 -d > kubeconfig
          export KUBECONFIG="$PWD/kubeconfig"
          kubectl -n app set image deployment/frontend frontend="$IMAGE"
          kubectl -n app rollout status deployment/frontend --timeout=180s

  deploy_staging:
    name: "Stage 7 - Staging Auto Deploy"
    needs: deploy_dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Deploy same signed artifact to staging
        env:
          KCFG: ${{ secrets.STAGING_KUBECONFIG_B64 }}
          IMAGE: ${{ needs.stage5_build_sign_attest.outputs.image_ref }}@${{ needs.stage5_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          echo "$KCFG" | base64 -d > kubeconfig
          export KUBECONFIG="$PWD/kubeconfig"
          kubectl -n app set image deployment/frontend frontend="$IMAGE"
          kubectl -n app rollout status deployment/frontend --timeout=180s

  stage6_dast:
    name: "Stage 6 - DAST"
    needs: deploy_staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_BASE_URL }}/frontend
          fail_action: true

  staging_acceptance:
    name: "Stage 7 - Staging Acceptance"
    needs: stage6_dast
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Acceptance smoke test
        run: |
          test -n "${{ secrets.STAGING_BASE_URL }}"
          curl -fsS "${{ secrets.STAGING_BASE_URL }}/frontend/healthz"

  policy_gate:
    name: "Stage 7 - Policy Gate"
    needs: staging_acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: OPA gate in CI
        run: |
          wget -qO- https://github.com/open-policy-agent/conftest/releases/download/v0.54.0/conftest_0.54.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin
          cat <<'EOF' > policy-input.json
          {"signed_artifact": true, "dast_passed": true, "acceptance_passed": true}
          EOF
          cat <<'EOF' > policy.rego
          package main
          deny[msg] { not input.signed_artifact; msg := "signed artifact required" }
          deny[msg] { not input.dast_passed; msg := "dast required" }
          deny[msg] { not input.acceptance_passed; msg := "acceptance required" }
          EOF
          conftest test policy-input.json -p .

  deploy_prod:
    name: "Stage 7 - Prod Approval and Progressive Deploy"
    needs: policy_gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Progressive rollout with auto rollback
        env:
          KCFG: ${{ secrets.PROD_KUBECONFIG_B64 }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          IMAGE: ${{ needs.stage5_build_sign_attest.outputs.image_ref }}@${{ needs.stage5_build_sign_attest.outputs.digest }}
        run: |
          test -n "$KCFG"
          echo "$KCFG" | base64 -d > kubeconfig
          export KUBECONFIG="$PWD/kubeconfig"
          kubectl -n app set image deployment/frontend frontend="$IMAGE"
          if ! kubectl -n app rollout status deployment/frontend --timeout=240s; then
            kubectl -n app rollout undo deployment/frontend
            exit 1
          fi
          if [ -n "$PROD_BASE_URL" ]; then
            if ! curl -fsS "${PROD_BASE_URL}/frontend/healthz"; then
              kubectl -n app rollout undo deployment/frontend
              exit 1
            fi
          fi
